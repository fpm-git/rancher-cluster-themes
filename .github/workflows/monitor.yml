name: Monitor published extension

on:
  schedule:
    - cron: '37 9 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.8.0
      - name: Check published chart versions and extension assets
        run: bash scripts/check-published-repository.sh "https://fpm-git.github.io/rancher-cluster-themes" "$RUNNER_TEMP/published-check"
