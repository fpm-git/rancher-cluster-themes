name: Monitor published extension

on:
  schedule:
    - cron: '37 9 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.8.0
      - name: Check published chart versions and extension assets
        run: bash scripts/check-published-repository.sh "https://fpm-git.github.io/rancher-cluster-themes" "$RUNNER_TEMP/published-check"
