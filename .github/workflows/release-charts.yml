name: Publish extension Helm repository

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing catalog release tag to publish
        required: true
        type: string
      redeploy:
        description: Redeploy existing published assets without rebuilding
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'rancher-cluster-themes-dev-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      chart: ${{ steps.metadata.outputs.chart }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0
          path: source
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
      - uses: actions/setup-node@v7
        with:
          node-version-file: source/.nvmrc
      - name: Install Yarn
        if: ${{ !inputs.redeploy }}
        run: npm install --global yarn@1.22.22
      - name: Install dependencies
        if: ${{ !inputs.redeploy }}
        working-directory: source
        run: yarn install --frozen-lockfile
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        if: ${{ !inputs.redeploy }}
        with:
          version: v3.8.0
      - name: Check release
        id: metadata
        working-directory: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          expected="$(node -p "require('./package.json').name + '-' + require('./package.json').version")"
          chart="$(node -p "require('./pkg/rancher-cluster-themes/package.json').name")"
          version="$(node -p "require('./pkg/rancher-cluster-themes/package.json').version")"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "::error::Release tag must be $expected"
            exit 1
          fi
          echo "chart=$chart" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check existing published assets
        if: ${{ inputs.redeploy }}
        working-directory: site
        env:
          CHART: ${{ steps.metadata.outputs.chart }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          yq -e '.entries[strenv(CHART)][] | select(.version == strenv(VERSION))' index.yaml > /dev/null
          test -s "assets/$CHART/$CHART-$VERSION.tgz"
          test -s "extensions/$CHART/$VERSION.tgz"
          test -s "extensions/$CHART/$VERSION/plugin/$CHART-$VERSION.umd.min.js"
      - name: Build Rancher extension chart
        if: ${{ !inputs.redeploy }}
        working-directory: source
        run: yarn publish-pkgs -s "$GITHUB_REPOSITORY" -b gh-pages -n
      - name: Merge Helm repository
        if: ${{ !inputs.redeploy }}
        run: bash tooling/scripts/merge-helm-repository.sh "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/site"
      - name: Publish chart assets
        if: ${{ !inputs.redeploy }}
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets extensions index.yaml
          git commit -m "Publish extension chart"
          git push origin HEAD:gh-pages

  prepare:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Prepare Pages content
        run: |
          mkdir -p "$RUNNER_TEMP/helm-repository"
          cp -a assets index.yaml "$RUNNER_TEMP/helm-repository/"
      - name: Name Pages artifact
        id: artifact
        run: echo "name=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/helm-repository

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.prepare.outputs.artifact_name }}

  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.8.0
      - name: Verify published repository
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          CHART: ${{ needs.build.outputs.chart }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          index="$RUNNER_TEMP/published-index.yaml"
          chart_file="$RUNNER_TEMP/published-chart.tgz"
          if [ -z "$PAGE_URL" ]; then
            echo "::error::Pages deployment did not return a URL"
            exit 1
          fi
          echo "Checking ${PAGE_URL%/}/index.yaml"
          found=false
          for attempt in {1..10}; do
            if curl -fsSL "${PAGE_URL%/}/index.yaml" -o "$index" &&
               yq -e '.entries[strenv(CHART)][] | select(.version == strenv(VERSION))' "$index" > /dev/null; then
              found=true
              break
            fi
            echo "Waiting for version $VERSION in the published index ($attempt/10)"
            sleep 5
          done
          if [ "$found" != true ]; then
            echo "::error::Published index did not contain version $VERSION after 10 attempts"
            exit 1
          fi
          chart_url="$(yq -r '.entries[strenv(CHART)][] | select(.version == strenv(VERSION)) | .urls[0]' "$index")"
          expected_chart="assets/$CHART/$CHART-$VERSION.tgz"
          if [ "$chart_url" != "$expected_chart" ]; then
            echo "::error::Published index does not contain the expected chart URL"
            exit 1
          fi
          curl -fsSL --retry 8 --retry-delay 3 --retry-all-errors "${PAGE_URL%/}/$chart_url" -o "$chart_file"
          helm show chart "$chart_file" | yq -e '.annotations."catalog.cattle.io/ui-component" == "plugins"'
          endpoint="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/gh-pages/extensions/$CHART/$VERSION"
          values="$RUNNER_TEMP/published-values.yaml"
          helm show values "$chart_file" > "$values"
          if [ "$(yq -r '.plugin.endpoint' "$values")" != "$endpoint" ] ||
             [ "$(yq -r '.plugin.compressedEndpoint' "$values")" != "$endpoint.tgz" ]; then
            echo "::error::Published chart has unexpected extension endpoints"
            exit 1
          fi
          curl -fsSL --retry 8 --retry-delay 3 --retry-all-errors "$endpoint.tgz" -o "$RUNNER_TEMP/published-extension.tgz"
          tar -tzf "$RUNNER_TEMP/published-extension.tgz" | grep -Fx "$VERSION/plugin/$CHART-$VERSION.umd.min.js"
          curl -fsSL --retry 8 --retry-delay 3 --retry-all-errors "$endpoint/plugin/$CHART-$VERSION.umd.min.js" -o "$RUNNER_TEMP/published-extension.js"
          test -s "$RUNNER_TEMP/published-extension.js"
