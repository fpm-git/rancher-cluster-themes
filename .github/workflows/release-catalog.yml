name: Release extension catalog

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.8.0
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          expected="$(node -p "require('./package.json').name + '-' + require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "::error::Release tag must be $expected"
            exit 1
          fi
      - name: Build catalog image
        run: yarn publish-pkgs -c -n -r ghcr.io -o "${GITHUB_REPOSITORY_OWNER,,}"
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push and verify catalog image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ui-extension-$(node -p "require('./package.json').name"):$(node -p "require('./package.json').version")"
          docker image inspect --format '{{.Id}}' "$image"
          docker push "$image"
          docker manifest inspect "$image" > /dev/null
